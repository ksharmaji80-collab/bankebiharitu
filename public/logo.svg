  <circle cx="121" cy="359" r="5" fill="#C9A227"/>
  <circle cx="82" cy="300" r="5" fill="#6E1E2B"/>
  <circle cx="68" cy="230" r="5" fill="#C9A227"/>
  <circle cx="82" cy="160" r="5" fill="#6E1E2B"/>
  <circle cx="121" cy="101" r="5" fill="#C9A227"/>
  <circle cx="180" cy="62" r="5" fill="#6E1E2B"/>
