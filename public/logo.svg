<circle cx="250" cy="230" r="168" fill="none" stroke="url(#goldEdge)" stroke-width="5"/>
<circle cx="250" cy="230" r="160" fill="url(#peacockFill)"/>
<circle cx="250" cy="230" r="141" fill="none" stroke="#F3D77C" stroke-width="1" opacity="0.6"/>

<path id="titleArc" d="M 126,230 A 124,124 0 0 1 374,230" fill="none"/>
<text font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari','Lohit Devanagari',serif" font-size="22" fill="#F8E6A8" letter-spacing="1">
  <textPath href="#titleArc" startOffset="50%" text-anchor="middle">श्री बांके बिहारी मंदिर</textPath>
</text>

