<svg viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Shree Banke Bihari Temple, Sainwa, Chhata, Mathura — logo</title>
<desc>Ornate gold and peacock-blue circular emblem with a jeweled beaded border, a peacock feather crest above a golden Om symbol, an arced temple name, and a ribbon banner with the temple name and location.</desc>

<defs>
  <radialGradient id="peacockFill" cx="42%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#1E6690"/>
    <stop offset="55%" stop-color="#0B3D5C"/>
    <stop offset="100%" stop-color="#062534"/>
  </radialGradient>
  <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F3D77C"/>
    <stop offset="45%" stop-color="#C9A227"/>
    <stop offset="100%" stop-color="#9A7A17"/>
  </linearGradient>
  <radialGradient id="omGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F3D77C" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#F3D77C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="omFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F8E6A8"/>
    <stop offset="100%" stop-color="#C9A227"/>
  </linearGradient>
</defs>

<circle cx="250" cy="230" r="195" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.55"/>

<g>
  <circle cx="432" cy="230" r="5" fill="#C9A227"/>
